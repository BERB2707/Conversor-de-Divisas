<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core" xmlns:p="http://primefaces.org/ui">
<h:head>
	<title>Divisas BranEste / COP_USD</title>
	<style>
body {
	font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
	background-color: #e9ecef; /* Fondo gris claro neutral */
	margin: 0;
	padding: 40px 20px;
}

.main-container {
	max-width: 750px;
	margin: 0 auto;
	background: #ffffff;
	border-radius: 12px;
	box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
	overflow: hidden;
	/* Para que el banner superior respete los bordes curvos */
}

/* Encabezado estilo Casa de Cambio / Banco */
.exchange-header {
	background: linear-gradient(135deg, #0a2540 0%, #144066 100%);
	/* Azul marino financiero */
	color: #ffffff;
	padding: 25px 20px;
	text-align: center;
	border-bottom: 4px solid #f1c40f; /* Línea dorada */
}

.exchange-header h2 {
	margin: 0;
	font-size: 1.6em;
	letter-spacing: 1px;
	text-transform: uppercase;
}

.content-body {
	padding: 30px;
}

/* Etiqueta de la Tasa Oficial (Dorada) */
.rate-badge {
	background: #f1c40f; /* Dorado moneda */
	color: #1a1a1a;
	padding: 10px 25px;
	border-radius: 30px;
	font-size: 1.05em;
	font-weight: 700;
	display: inline-block;
	margin-bottom: 30px;
	box-shadow: 0 3px 8px rgba(241, 196, 15, 0.3);
}

.form-grid {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 20px;
	margin-bottom: 25px;
}

.input-group {
	display: flex;
	flex-direction: column;
	gap: 8px;
}

.input-group label {
	font-weight: 700;
	color: #0a2540;
	font-size: 0.95em;
}

.action-section {
	text-align: center;
	margin-top: 20px;
	padding-top: 20px;
	border-top: 1px dashed #ced4da;
}

/* Caja de Resultado (Verde Billete) */
.result-box {
	background: linear-gradient(to right, #0f5132, #146c43);
	/* Verde oscuro financiero */
	color: #ffffff;
	padding: 25px;
	border-radius: 10px;
	margin-top: 30px;
	text-align: center;
	box-shadow: 0 6px 15px rgba(15, 81, 50, 0.3);
}

.result-amount {
	font-size: 2.2em;
	font-weight: 800;
	color: #a3cfbb; /* Verde claro para el número */
	margin-top: 5px;
	display: block;
	text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
}

/* Ajustes globales de PrimeFaces para que combinen con el tema */
body .ui-button.btn-exchange {
	background-color: #0a2540; /* Botón azul marino */
	border-color: #0a2540;
	font-weight: bold;
	font-size: 1.1em;
	border-radius: 6px;
}

body .ui-button.btn-exchange:hover {
	background-color: #144066;
	border-color: #144066;
}

body .ui-panel .ui-panel-titlebar {
	background: transparent;
	border: none;
	color: #0a2540;
	font-size: 1.1em;
	padding: 0 0 10px 0;
	border-bottom: 2px solid #e9ecef;
}

body .ui-panel .ui-panel-content {
	border: none;
	padding: 15px 0 0 0;
}
</style>
</h:head>
<h:body>
	<div class="main-container">

		<div class="exchange-header">
			<h2>
				<i class="pi pi-globe" style="margin-right: 10px; font-size: 1.2em;"></i>Divisas
				Express
			</h2>
			<span style="font-size: 0.9em; opacity: 0.9;">Cotización en Tiempo Real No Tardaras Más COP / USD</span>
		</div>

		<div class="content-body">
			<h:form id="formConversor">

				<div style="text-align: center;">
					<div class="rate-badge">
						<i class="pi pi-chart-line" style="margin-right: 8px;"></i> Tasa
						de Cambio Oficial: 1 USD =
						<h:outputText value="#{converterBean.tasaActual}">
							<f:convertNumber type="currency" currencySymbol="$ "
								maxFractionDigits="2" />
						</h:outputText>
						COP
					</div>
				</div>

				<p:messages id="mensajes" showDetail="true" closable="true">
					<p:autoUpdate />
				</p:messages>

				<div class="form-grid">
					<div class="input-group">
						<p:outputLabel for="monto" value="Monto a cambiar:" />
						<p:inputNumber id="monto" value="#{converterBean.montoInput}"
							placeholder="Ej. 100000" minValue="0" decimalPlaces="2"
							requiredMessage="El monto es obligatorio." style="width: 100%;">
							<f:validateRequired />
							<f:validateDoubleRange minimum="0.01" />
						</p:inputNumber>
					</div>

					<div class="input-group">
						<p:outputLabel for="tipo" value="Operación:" />
						<p:selectOneMenu id="tipo"
							value="#{converterBean.tipoSeleccionado}" style="width: 100%;">
							<f:selectItem itemLabel="Comprar Dólares (COP a USD)"
								itemValue="COP_TO_USD" />
							<f:selectItem itemLabel="Vender Dólares (USD a COP)"
								itemValue="USD_TO_COP" />
							<f:validateRequired />
						</p:selectOneMenu>
					</div>
				</div>

				<div class="action-section">
					<p:commandButton value="Procesar Transacción" icon="pi pi-wallet"
						action="#{converterBean.convertir}" process="@form"
						update="panelResultado panelHistorial" validateClient="true"
						styleClass="ui-button-raised btn-exchange"
						style="width: 280px; padding: 8px;" />
				</div>

				<h:panelGroup id="panelResultado">
					<h:panelGroup
						rendered="#{not empty converterBean.ultimaConversion}"
						layout="block" styleClass="result-box">
						<span
							style="color: #d1e7dd; font-size: 0.95em; text-transform: uppercase; letter-spacing: 2px;">
							<i class="pi pi-check-circle" style="margin-right: 5px;"></i>
							Transacción Exitosa
						</span>
						<br />
						<br />
						<div
							style="display: flex; justify-content: center; align-items: center; gap: 20px;">
							<div>
								<h:outputText
									value="#{converterBean.ultimaConversion.montoOrigen}"
									style="font-size: 1.2em; font-weight: 600;">
									<f:convertNumber pattern="#,##0.00" />
								</h:outputText>
							</div>
							<i class="pi pi-arrow-right"
								style="color: #f1c40f; font-size: 1.5em;"></i>
							<div>
								<h:outputText
									value="#{converterBean.ultimaConversion.montoResultado}"
									class="result-amount">
									<f:convertNumber pattern="#,##0.00" />
								</h:outputText>
							</div>
						</div>
					</h:panelGroup>
				</h:panelGroup>

				<div style="margin-top: 45px;">
					<p:panel id="panelHistorial"
						header="Últimos Movimientos de la Sesión" toggleable="true">
						<p:dataTable value="#{converterBean.historial}" var="item"
							emptyMessage="No hay movimientos recientes." stripedRows="true"
							size="small" style="margin-top: 10px;">

							<p:column headerText="Fecha/Hora" width="130">
								<h:outputText value="#{item.fechaHora}"
									style="font-size: 0.85em; color: #555;" />
							</p:column>

							<p:column headerText="Tipo" width="110"
								style="text-align: center;">
								<p:tag
									value="#{item.tipoConversion eq 'COP_TO_USD' ? 'COMPRA USD' : 'VENTA USD'}"
									severity="#{item.tipoConversion eq 'COP_TO_USD' ? 'warning' : 'success'}" />
							</p:column>

							<p:column headerText="Entregas" style="text-align: right;">
								<h:outputText value="#{item.montoOrigen}">
									<f:convertNumber pattern="#,##0.00" />
								</h:outputText>
							</p:column>

							<p:column headerText="Recibes"
								style="text-align: right; font-weight: bold; color: #0f5132;">
								<h:outputText value="#{item.montoResultado}">
									<f:convertNumber pattern="#,##0.00" />
								</h:outputText>
							</p:column>
						</p:dataTable>
					</p:panel>
				</div>

			</h:form>
		</div>
	</div>
</h:body>
</html>
